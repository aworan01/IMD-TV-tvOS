name: IMDTV
options:
  bundleIdPrefix: org.imdtv
  deploymentTarget:
    tvOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
packages:
  KSPlayer:
    url: https://github.com/kingslay/KSPlayer.git
    branch: main
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  IMDTV:
    type: application
    platform: tvOS
    sources:
      - path: IMDTV
    resources:
      - path: IMDTV/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.imdtv.player
        PRODUCT_NAME: IMD TV
        INFOPLIST_FILE: IMDTV/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    dependencies:
      - package: KSPlayer
        product: KSPlayer
      - package: KSPlayer
        product: KSPlayerUI
      - target: IMDTVTopShelf
        embed: true
    scheme:
      testTargets:
        - IMDTVTests
  IMDTVTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - path: IMDTVTopShelf
    resources:
      - path: IMDTVTopShelf/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.imdtv.player.topshelf
        PRODUCT_NAME: IMD TV Top Shelf
        INFOPLIST_FILE: IMDTVTopShelf/Info.plist
        SKIP_INSTALL: YES
  IMDTVTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: Tests
    dependencies:
      - target: IMDTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.imdtv.player.tests

