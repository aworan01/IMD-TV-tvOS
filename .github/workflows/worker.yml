name: Deploy Pairing Worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["PairingWorker/**"]
jobs:
  deploy:
    if: ${{ vars.CLOUDFLARE_KV_CONFIGURED == 'true' }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: PairingWorker } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

